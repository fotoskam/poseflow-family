<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3eee6">
  <meta name="description" content="PoseFlow Family – természetes családi fotós instrukciók.">
  <title>PoseFlow Family — JÓZSA / FOTOGRÁFIA</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#top" aria-label="PoseFlow Family nyitóoldal">
      <span class="brand-name">JÓZSA</span><span class="brand-divider">/</span><span>FOTOGRÁFIA</span>
    </a>
    <p class="eyebrow">POSEFLOW · FAMILY</p>
  </header>

  <main id="top">
    <section class="intro" aria-labelledby="title">
      <p class="kicker">20 egyszerű helyzet</p>
      <h1 id="title">Kevesebb póz.<br><em>Több valódi pillanat.</em></h1>
      <p class="lede">Rövid instrukciók, amiket könnyű kimondani, és még könnyebb megcsinálni.</p>
      <a class="start-link" href="#cards">Kezdjük <span aria-hidden="true">↓</span></a>
    </section>

    <section id="cards" class="cards" aria-label="Fotós instrukciók">
      <!-- A kártyákat a script tölti fel. -->
    </section>
  </main>

  <footer>
    <span>POSEFLOW FAMILY</span>
    <span>20 / 20</span>
  </footer>

  <dialog class="lightbox" aria-label="Teljes képernyős képgaléria">
    <button class="lightbox-close" type="button" aria-label="Bezárás">×</button>
    <button class="lightbox-nav lightbox-prev" type="button" aria-label="Előző kép">←</button>
    <figure>
      <img src="" alt="">
      <figcaption></figcaption>
    </figure>
    <button class="lightbox-nav lightbox-next" type="button" aria-label="Következő kép">→</button>
    <div class="lightbox-count" aria-live="polite"></div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
